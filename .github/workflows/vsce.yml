name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify package build
        run: npx --yes @vscode/vsce package --no-git-tag-version

      - name: Verify Marketplace PAT
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx --yes @vscode/vsce verify-pat DarkKnight -p "$VSCE_TOKEN"
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx --yes @vscode/vsce publish -p "$VSCE_TOKEN"
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
